name: cubacel_ussd
description: "Aplicación para acceder a códigos USSD de Cubacel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.1.11 # Para intentar marcar automáticamente si el dispositivo lo permite
  share_plus: ^7.0.0 # Para compartir códigos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
